name: package-dotnet-sdk-10-0-401

on:
  push:
    branches:
      - actions-runner-probe-20260921
    paths:
      - .github/workflows/package-dotnet-sdk-10-0-401.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install exact SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Freeze exact SDK tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(dotnet --version)" = '10.0.401'
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          printf '%s\n' "$root" > dotnet-root.txt
          dotnet --info > dotnet-info.txt
          tar --numeric-owner --owner=0 --group=0 -C "$root" -czf dotnet-sdk-10.0.401-linux-x64-offline.tar.gz .
          sha256sum dotnet-sdk-10.0.401-linux-x64-offline.tar.gz > dotnet-sdk-10.0.401-linux-x64-offline.tar.gz.sha256
          ls -lh dotnet-sdk-10.0.401-linux-x64-offline.tar.gz

      - name: Upload exact SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.401-linux-x64-offline
          path: |
            dotnet-sdk-10.0.401-linux-x64-offline.tar.gz
            dotnet-sdk-10.0.401-linux-x64-offline.tar.gz.sha256
            dotnet-info.txt
            dotnet-root.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
